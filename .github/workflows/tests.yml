name: Run Vitest Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Nutzt caching für schnellere Builds (bei pnpm: 'pnpm', bei yarn: 'yarn')

      - name: Install Dependencies
        run: npm ci

      - name: Run Vitest
        run: npx vitest run
